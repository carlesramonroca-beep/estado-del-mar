<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Firusub · Imagen del parte para redes</title>
<!-- Tarjeta 1080x1350 para redes sociales. Lee parte.json (o ?src=otro.json). La genera el parte automático con una captura. -->
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1350px;overflow:hidden}
body{font-family:Inter,"Inter Display",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#eef6fb;
  background:radial-gradient(120% 70% at 80% 0%,#1d6f9a 0%,#0e3d5c 45%,#071c2b 100%)}
.card{position:relative;width:1080px;height:1350px;padding:70px 72px 0;display:flex;flex-direction:column}
.waves{position:absolute;left:0;right:0;bottom:0;height:300px;z-index:0}
.top{display:flex;justify-content:space-between;align-items:flex-start;z-index:1}
.brand{font-size:40px;font-weight:800;letter-spacing:-.5px}
.brand small{display:block;font-size:24px;font-weight:500;color:#9cc7e0;letter-spacing:.5px;margin-top:4px}
.date{text-align:right;font-size:26px;color:#9cc7e0;font-weight:500;line-height:1.35}
.date b{display:block;color:#fff;font-size:34px;font-weight:700}
h1{z-index:1;margin-top:54px;font-size:66px;line-height:1.08;font-weight:800;letter-spacing:-1.5px}
.texto{z-index:1;margin-top:26px;font-size:31px;line-height:1.42;color:#d3e7f3;font-weight:400}
.salidas{z-index:1;display:flex;gap:22px;margin-top:44px}
.sal{flex:1;border-radius:28px;padding:26px 28px;background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.12)}
.sal .f{font-size:24px;color:#9cc7e0;font-weight:600;text-transform:uppercase;letter-spacing:1.5px}
.sal .d{margin-top:10px;font-size:44px;font-weight:800;display:flex;align-items:center;gap:14px;letter-spacing:-.5px}
.sal .d i{width:30px;height:30px;border-radius:50%;flex:none;box-shadow:0 0 24px currentColor}
.ok{color:#36e08a}.warn{color:#ffc93c}.no{color:#ff5a4e}
.ok i{background:#36e08a}.warn i{background:#ffc93c}.no i{background:#ff5a4e}
.stats{z-index:1;display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:30px}
.st{background:rgba(0,0,0,.18);border-radius:22px;padding:20px 22px}
.st .k{font-size:21px;color:#9cc7e0;font-weight:600;text-transform:uppercase;letter-spacing:1.2px}
.st .v{font-size:31px;font-weight:700;margin-top:8px;line-height:1.2}
.aviso{z-index:1;margin-top:26px;border-radius:22px;padding:20px 26px;font-size:26px;line-height:1.35;font-weight:600;display:flex;gap:16px;align-items:flex-start}
.aviso.naranja{background:rgba(255,140,40,.2);border:2px solid #ff9a3c;color:#ffd2a6}
.aviso.amarillo{background:rgba(255,201,60,.16);border:2px solid #ffc93c;color:#ffe9a8}
.aviso.rojo{background:rgba(255,70,60,.22);border:2px solid #ff5a4e;color:#ffc2bd}
.aviso.info{background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.14);color:#d3e7f3;font-weight:500}
.aviso .ic{font-size:30px;line-height:1}
.foot{position:absolute;left:72px;right:72px;bottom:52px;z-index:2;display:flex;justify-content:space-between;align-items:flex-end;font-size:23px;color:#cfe6f3}
.foot b{color:#fff;font-size:26px}
.foot .url{text-align:right;color:#9cc7e0;white-space:nowrap;font-size:21px}
</style>
</head>
<body>
<div class="card" id="card">
  <svg class="waves" viewBox="0 0 1080 300" preserveAspectRatio="none" aria-hidden="true">
    <path d="M0 120 C 180 70 300 170 540 120 S 900 70 1080 120 V300 H0Z" fill="#2a8fc0" opacity=".18"/>
    <path d="M0 170 C 200 120 340 220 560 170 S 920 120 1080 170 V300 H0Z" fill="#3fb0e0" opacity=".16"/>
    <path d="M0 220 C 160 185 380 260 600 220 S 940 185 1080 220 V300 H0Z" fill="#061826" opacity=".7"/>
  </svg>
  <div class="top">
    <div class="brand">Firusub<small>Parte del mar · Sant Elm</small></div>
    <div class="date" id="fecha"></div>
  </div>
  <h1 id="titulo"></h1>
  <div class="texto" id="texto"></div>
  <div class="salidas" id="salidas"></div>
  <div class="stats" id="stats"></div>
  <div id="avisos"></div>
  <div class="foot"><div><b>Firusub</b><br>Centro de buceo · Sant Elm</div><div class="url">Parte en directo<br><span style="color:#fff;font-weight:600">carlesramonroca-beep.github.io/estado-del-mar</span></div></div>
</div>
<script>
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function cls(d){d=String(d||"").toUpperCase();return d.includes("NO")?"no":d.includes("PREC")?"warn":"ok"}
function lab(d){const c=cls(d);return c==="no"?"No salimos":c==="warn"?"Precaución":"Salimos"}
async function render(){
  const q=new URLSearchParams(location.search);
  const p=await fetch((q.get("src")||"parte.json")+"?t="+Date.now(),{cache:"no-store"}).then(r=>r.json());
  const d=p.actualizado?new Date(p.actualizado):new Date();
  const tz={timeZone:"Europe/Madrid"};
  document.getElementById("fecha").innerHTML=`<b>${(t=>t[0].toUpperCase()+t.slice(1))(d.toLocaleDateString("es-ES",{...tz,weekday:"long",day:"numeric",month:"long"}))}</b>Actualizado ${d.toLocaleTimeString("es-ES",{...tz,hour:"2-digit",minute:"2-digit"})} h`;
  document.getElementById("titulo").textContent=p.titulo||"Parte del mar";
  document.getElementById("texto").textContent=p.texto||"";
  const sal=Array.isArray(p.salidas)?p.salidas.slice(0,3):[];
  document.getElementById("salidas").innerHTML=sal.map(s=>`<div class="sal"><div class="f">${esc(s.franja)}</div><div class="d ${cls(s.decision)}"><i></i>${esc(s.etiqueta||lab(s.decision))}</div></div>`).join("");
  const st=[["Mar",p.ola],["Viento",p.viento],["Boya Dragonera",p.boya]].filter(x=>x[1]);
  document.getElementById("stats").innerHTML=st.map(([k,v])=>`<div class="st"><div class="k">${k}</div><div class="v">${esc(v)}</div></div>`).join("");
  document.getElementById("stats").style.gridTemplateColumns=`repeat(${Math.max(st.length,1)},1fr)`;
  let av="";
  if(p.avisos){const a=p.avisos.toLowerCase();const lvl=a.includes("rojo")?"rojo":a.includes("naranja")?"naranja":a.includes("amarillo")?"amarillo":"info";
    av+=`<div class="aviso ${lvl}"><span class="ic">⚠️</span><span>${esc(p.aviso_corto||p.avisos)}</span></div>`}
  if(p.rayos&&/tormenta|rayo/i.test(p.rayos)&&!/sin rayos|bajo/i.test(p.rayos))av+=`<div class="aviso amarillo"><span class="ic">⚡</span><span>${esc(p.rayos)}</span></div>`;
  document.getElementById("avisos").innerHTML=av;
  // ajusta el texto si no cabe
  const card=document.getElementById("card"),tx=document.getElementById("texto"),h1=document.getElementById("titulo");
  let fs=31,hs=66;const fits=()=>{const r=document.getElementById("avisos").getBoundingClientRect();return r.bottom<1350-150};
  while(!fits()&&fs>22){fs-=1;tx.style.fontSize=fs+"px";if(hs>50){hs-=2;h1.style.fontSize=hs+"px"}}
  document.body.dataset.ready="1";
}
render().catch(e=>{document.getElementById("titulo").textContent="Error: "+e.message;document.body.dataset.ready="1"});
</script>
</body>
</html>
